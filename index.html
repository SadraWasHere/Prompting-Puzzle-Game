<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pruzzle!</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#cfe6ff;--g2:#ecd6ff;--g3:#c9f5e8;--fg:#14202b;--mut:#43566a;--glass:rgba(255,255,255,.45);--gb:rgba(255,255,255,.8);--acc:#0b7f69;--accfg:#fff;--inp:rgba(255,255,255,.6);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#0d2740;--g2:#321a52;--g3:#0a4d47;--fg:#f2f6fb;--mut:#b9c6d4;--glass:rgba(255,255,255,.1);--gb:rgba(255,255,255,.25);--acc:#7ff0d4;--accfg:#06241d;--inp:rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--g1:#0d2740;--g2:#321a52;--g3:#0a4d47;--fg:#f2f6fb;--mut:#b9c6d4;--glass:rgba(255,255,255,.1);--gb:rgba(255,255,255,.25);--acc:#7ff0d4;--accfg:#06241d;--inp:rgba(255,255,255,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:Vazir,Vazirmatn,Tahoma,sans-serif;line-height:1.7;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3)) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 20%,rgba(255,120,200,.35),transparent 40%),radial-gradient(circle at 85% 75%,rgba(70,220,200,.35),transparent 42%)}
main{max-width:1180px;margin:0 auto;padding:16px;min-height:100vh;display:flex;align-items:center;justify-content:center}
.gl{background:var(--glass);border:1px solid var(--gb);border-radius:20px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 8px 32px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.4)}
.card{width:100%;max-width:520px;padding:44px 24px;text-align:center}
h1{font-size:2.6rem;margin:0 0 10px;direction:ltr;letter-spacing:.5px}
.soon{font-size:1.25rem;font-weight:500;color:var(--mut);margin:0}
.dots span{display:inline-block;animation:blink 1.4s infinite both}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dots span{animation:none}}
@media(max-width:480px){h1{font-size:2.2rem}.card{padding:36px 18px}}
</style>
</head>
<body>
<main>
<section class="gl card">
<h1>Pruzzle!</h1>
<p class="soon">بزودی<span class="dots"><span>.</span><span>.</span><span>.</span></span></p>
</section>
</main>
</body>
</html>
