<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pruzzle!</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--fg:#fff;--mut:#bdb9d0;--glass:rgba(255,255,255,.07);--gb:rgba(255,255,255,.2);--acc:#ffb81c;--accfg:#1d1400;--inp:rgba(255,255,255,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:Vazirmatn,Vazir,Tahoma,sans-serif;line-height:1.7;background:#0d0b1e}
main{max-width:1180px;margin:0 auto;padding:16px}.gl{background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--gb);border-radius:28px;backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
h1{font-size:1.5rem;margin:0 0 6px}
.brand{max-width:1180px;margin:10px auto 18px;padding:16px 20px;text-align:center}
.brand h1{font-size:1.7rem;margin:0 0 4px}
.brand .affiliation{font-size:.78rem;color:var(--mut);font-weight:500}
.card{max-width:520px;margin:7vh auto 0;padding:28px}label{display:block;margin:10px 0 2px;font-size:.9rem;color:var(--mut)}
input{width:100%;font:inherit;color:var(--fg);background:var(--inp);border:1px solid var(--gb);border-radius:12px;padding:10px 12px}button{font:inherit;color:var(--fg);cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{background:var(--inp);border:1px solid var(--gb);border-radius:14px;padding:9px 20px;transition:transform .15s,filter .15s}.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.12)}.main{background:linear-gradient(135deg,#ffd43b,#f5a30a);color:var(--accfg);border-color:var(--acc);font-weight:700}.btn:disabled{opacity:.45;cursor:default}
.err{color:#ff8aa5;min-height:1.6em;font-size:.9rem}.hint{color:var(--mut);font-size:.9rem}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;color:var(--mut);font-size:.9rem}
.problem{padding:16px 18px;margin-bottom:12px;white-space:pre-line;font-weight:600}.grid{display:grid;grid-template-columns:190px minmax(260px,1fr) minmax(280px,1fr);gap:12px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{padding:12px;min-width:0}.panel h2{font-size:.92rem;margin:0 0 8px;color:var(--mut)}.pr{display:flex;align-items:center;gap:8px;width:100%;text-align:right;padding:8px 10px;margin-bottom:6px;border:2px solid transparent;border-radius:12px;color:#10201a}.pr.open{border-color:var(--fg)}.pr .ck{margin-inline-start:auto}
.opt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:right;padding:9px 12px;margin-bottom:8px;border:1px solid var(--gb);border-radius:12px;background:var(--inp);color:var(--fg)}.opt.sel{border:2px solid var(--acc);padding:8px 11px;background:rgba(255,184,28,.14)}.letter{flex:0 0 27px;display:inline-grid;place-items:center;width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.14);font-weight:700;direction:ltr}
.stack{display:flex;flex-direction:column;gap:6px}.order-hint{margin:4px 0 10px;padding:8px 10px;border-radius:10px;background:var(--inp);line-height:1.8}.blk{padding:8px 12px 8px 84px;color:#10201a;border-radius:12px;position:relative;font-size:.9rem;border:1px solid rgba(255,255,255,.6);overflow-wrap:anywhere}.blk b{display:block;font-size:.8rem}.ctl{position:absolute;left:6px;top:6px;display:flex;gap:3px}.ctl button{border:0;background:rgba(0,0,0,.14);border-radius:8px;width:24px;height:24px;padding:0;color:#10201a;font-size:.75rem}.cap{padding:7px 12px;border-radius:12px;background:rgba(255,184,28,.14);border:1px solid rgba(255,184,28,.35);color:#ffd36b;font-weight:700}.empty{padding:14px;color:var(--mut);font-size:.9rem;text-align:center;border:1px dashed var(--gb);border-radius:12px}.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.res{margin-top:12px;padding:16px}.score{font-size:1.8rem;font-weight:700}.fb{padding:8px 0;border-top:1px solid var(--gb);font-size:.92rem}.small{font-size:.82rem;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;text-align:right;border-bottom:1px solid var(--gb)}[hidden]{display:none!important}.privacy{margin-top:10px;font-size:.78rem;color:var(--mut)}
.site-credit{margin:18px auto 8px;text-align:center;font-size:.72rem;font-weight:400;color:var(--mut);line-height:1.6;padding:0 8px}
.closing-card{max-width:560px;text-align:center;margin:12vh auto 24px;padding:24px}
.closing-thanks{font-size:1.05rem;margin-top:18px}
.closing-brand{margin:26px auto 0;padding:12px 16px 10px;max-width:330px;border-radius:16px;background:rgba(255,255,255,.88);border:1px solid rgba(20,32,43,.12)}
.closing-logo{display:block;width:min(190px,72%);height:auto;max-height:245px;object-fit:contain;margin:0 auto}
.closing-brand .site-credit{margin:10px auto 0;color:#263442;font-size:.78rem;font-weight:600;line-height:1.8}
@media(max-width:480px){.closing-card{margin:8vh auto 18px;padding:20px 16px}.closing-brand{padding:10px 12px}.closing-logo{width:min(170px,78%);max-height:220px}}

/* Pruzzle theme: glows + transitions */
.glows{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.g{position:absolute;width:min(78vw,820px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);left:var(--x);top:var(--y);transition:left 1.3s cubic-bezier(.65,0,.35,1),top 1.3s cubic-bezier(.65,0,.35,1);filter:blur(24px)}
.g1{background:radial-gradient(circle,rgba(190,50,120,.7),transparent 62%)}
.g2{background:radial-gradient(circle,rgba(230,150,20,.62),transparent 62%);width:min(60vw,640px)}
.g3{background:radial-gradient(circle,rgba(55,90,220,.6),transparent 62%);width:min(70vw,740px)}
body[data-scene=reg]{--x1:84%;--y1:14%;--x2:20%;--y2:86%;--x3:88%;--y3:92%}
body[data-scene=game]{--x1:8%;--y1:10%;--x2:94%;--y2:48%;--x3:45%;--y3:98%}
body[data-scene=bd]{--x1:55%;--y1:-4%;--x2:6%;--y2:62%;--x3:96%;--y3:76%}
body[data-scene=thankyou]{--x1:18%;--y1:82%;--x2:82%;--y2:18%;--x3:50%;--y3:50%}
.g1{--x:var(--x1);--y:var(--y1)}.g2{--x:var(--x2);--y:var(--y2)}.g3{--x:var(--x3);--y:var(--y3)}
.brand-hero{text-align:center;margin-bottom:14px}.brand-hero .logo{width:112px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 24px rgba(245,163,10,.35))}
.brand-hero h1{font:700 2.8rem/1.15 Roboto,Vazirmatn,sans-serif;margin:0;letter-spacing:-.5px}.brand-hero .sub{color:var(--acc);font-weight:700;font-size:1.05rem;margin-top:4px}
.bar .mini{width:30px;height:auto}
.hint{text-align:center}
@keyframes fo{to{opacity:0;transform:translateY(-8px) scale(.99)}}
@keyframes fi{from{opacity:0;transform:translateY(10px) scale(.99)}}
.out{animation:fo .35s ease-in forwards;pointer-events:none}.in{animation:fi .55s ease-out both}
@media(prefers-reduced-motion:reduce){.g{transition:none}.out,.in{animation:none}}

.bar .brandmark{display:inline-flex;align-items:center;gap:8px;color:#fff}.bar .brandmark b{font:700 1.15rem Roboto,sans-serif}.bar .mini{width:30px}
.pr{color:#fff;background:color-mix(in srgb,var(--c) 14%,rgba(20,16,40,.4));border:1.5px solid color-mix(in srgb,var(--c) 65%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent),inset 0 0 12px color-mix(in srgb,var(--c) 16%,transparent);transition:box-shadow .25s,transform .15s}
.pr:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 22px color-mix(in srgb,var(--c) 60%,transparent),inset 0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}
.pr.open{border-color:var(--c);background:color-mix(in srgb,var(--c) 26%,rgba(20,16,40,.4));box-shadow:0 0 26px var(--c),inset 0 0 16px color-mix(in srgb,var(--c) 30%,transparent)}
.pr b{text-shadow:0 0 10px color-mix(in srgb,var(--c) 80%,transparent)}
.blk{color:#fff;background:color-mix(in srgb,var(--c) 14%,rgba(20,16,40,.5));border:1.5px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 14px color-mix(in srgb,var(--c) 32%,transparent)}.blk b{color:var(--c)}.ctl button{background:rgba(255,255,255,.14);color:#fff}
.opt{user-select:none;-webkit-user-select:none;cursor:grab}.grip{flex:0 0 auto;color:var(--mut);cursor:grab;touch-action:none;padding:0 4px;font-size:1.15rem;line-height:1.5}
.dnd-hint{margin:-4px 0 8px}.opt.dragging{opacity:.35}.drag-on,.drag-on *{cursor:grabbing!important;user-select:none}
.opt.ghost{position:fixed;left:0;top:0;z-index:99;pointer-events:none;margin:0;opacity:.96;background:rgba(34,28,62,.97);border:2px solid var(--acc);box-shadow:0 0 28px rgba(255,184,28,.55),0 14px 40px rgba(0,0,0,.5);transform-origin:top right}
.panel.over{border-color:var(--acc);box-shadow:0 0 34px rgba(255,184,28,.35),inset 0 0 24px rgba(255,184,28,.08)}
.ins-b{position:relative}.ins-b::before{content:"";position:absolute;left:0;right:0;top:-5px;height:3px;border-radius:2px;background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* Intro welcome overlay — two-stage layout */
.intro-overlay{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:clamp(12px,3vw,32px);background:rgba(5,5,14,.82);opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
.intro-overlay.is-closing{opacity:0;visibility:hidden;pointer-events:none}
.intro-overlay .intro-backdrop{position:absolute;inset:0;background:rgba(5,5,14,.28);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
.intro-shell{position:relative;z-index:1;width:min(1180px,96vw);height:min(620px,82vh);direction:ltr}
.intro-video-wrap{position:absolute;left:calc(100% - min(500px,43vw));right:auto;top:50%;width:min(500px,43vw);aspect-ratio:16/9;min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.22);border-radius:22px;background:#090914;box-shadow:0 24px 80px rgba(0,0,0,.55);opacity:0;transform:translate(0,calc(-50% + 24px)) scale(.97);transition:left .85s cubic-bezier(.22,.8,.25,1),top .85s cubic-bezier(.22,.8,.25,1),width .85s cubic-bezier(.22,.8,.25,1),transform .85s cubic-bezier(.22,.8,.25,1),opacity .55s ease}
.intro-video-wrap.is-ready{opacity:1;transform:translate(0,-50%) scale(1)}
.intro-video-wrap iframe{display:block;width:100%;height:100%;border:0}
.intro-close{position:absolute;z-index:3;top:10px;right:10px;width:38px;height:38px;border:1px solid rgba(255,255,255,.3);border-radius:50%;background:rgba(8,8,18,.72);color:#fff;font:400 25px/1 Arial,sans-serif;display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .2s}
.intro-close:hover{background:rgba(255,184,28,.95);color:#211600;transform:rotate(90deg)}
.intro-character-side{position:absolute;inset:0 auto 0 0;width:54%;min-width:0;transition:opacity .5s ease,transform .65s cubic-bezier(.22,.8,.25,1)}
.intro-mascot{position:fixed;display:block;left:clamp(20px,4vw,52px);bottom:0;width:min(300px,25vw);max-height:48vh;object-fit:contain;object-position:bottom left;filter:drop-shadow(0 16px 28px rgba(0,0,0,.35));opacity:0;transform:translateX(-30px) scale(.92);animation:introMascotIn .85s cubic-bezier(.22,.8,.25,1) .12s forwards}
.intro-speech{position:absolute;top:36%;right:32px;width:min(410px,90%);padding:22px 24px 18px;border:1px solid rgba(255,255,255,.28);border-radius:24px;background:#fff;color:#201b2c;text-align:center;box-shadow:0 12px 35px rgba(0,0,0,.28);opacity:0;transform:translateY(15px) scale(.96);animation:introBubbleIn .55s ease-out .42s forwards}
.intro-speech:after{content:"";position:absolute;bottom:-11px;left:52px;width:20px;height:20px;background:#fff;border-right:1px solid rgba(255,255,255,.28);border-bottom:1px solid rgba(255,255,255,.28);transform:rotate(45deg)}
.intro-bubble{position:relative;z-index:1;margin:0;color:#201b2c;font-size:clamp(.95rem,1.45vw,1.08rem);font-weight:700;line-height:1.9}
.intro-ok{position:relative;z-index:2;display:block;margin:16px auto 0;min-width:124px;padding:9px 26px;border:1px solid #ffb81c;border-radius:13px;background:linear-gradient(135deg,#ffd43b,#f5a30a);color:#211600;font-weight:700;box-shadow:0 8px 24px rgba(245,163,10,.22);cursor:pointer}
@keyframes introMascotIn{to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes introBubbleIn{to{opacity:1;transform:translateY(0) scale(1)}}
/* Stage two: mascot and speech fade out; video smoothly moves to screen center */
.intro-shell.is-video-focus .intro-character-side{opacity:0;transform:translateX(-35px) scale(.96);pointer-events:none}
.intro-shell.is-video-focus .intro-video-wrap{left:50%;top:50%;width:min(900px,90vw);transform:translate(-50%,-50%) scale(1);opacity:1}
@media(max-width:700px){
 .intro-shell{width:96vw;height:88vh}
 .intro-video-wrap{left:50%;top:5%;width:min(560px,92vw);transform:translate(-50%,24px) scale(.97);border-radius:16px}
 .intro-video-wrap.is-ready{transform:translate(-50%,0) scale(1)}
 .intro-character-side{inset:0;width:100%}
 .intro-mascot{left:4vw;bottom:0;width:min(210px,43vw);max-height:37vh}
 .intro-speech{top:auto;right:0;bottom:15%;width:min(340px,68vw);padding:14px 14px 12px;border-radius:18px}
 .intro-speech:after{left:24px}
 .intro-bubble{font-size:.88rem}
 .intro-ok{margin-top:10px;padding:8px 22px}
 .intro-shell.is-video-focus .intro-video-wrap{left:50%;top:50%;width:min(900px,94vw);transform:translate(-50%,-50%) scale(1)}
}
@media(max-width:380px){.intro-mascot{width:39vw;max-height:32vh}.intro-speech{bottom:13%;width:66vw;padding:11px}.intro-bubble{font-size:.8rem}}
@media(prefers-reduced-motion:reduce){.intro-video-wrap,.intro-mascot,.intro-speech{animation:none;opacity:1;transform:none}.intro-overlay,.intro-character-side,.intro-video-wrap{transition:none}}
body.intro-open{overflow:hidden}
.intro-low-power .intro-overlay .intro-backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}

</style>
